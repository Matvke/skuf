openapi: 3.0.3
info:
  title: Sanitizer Engine API
  description: |
    API микросервиса детекции и замены чувствительных данных.
    Engine — мозг системы: хранит профили, запускает детекторы,
    принимает решения (send/block), ведёт журнал событий.
  version: 1.0.0
  contact:
    name: Sanitizer Team

servers:
  - url: http://engine:8081
    description: Внутренняя сеть Docker

tags:
  - name: Sanitize
    description: Основной функционал — анализ и очистка текста
  - name: Profiles
    description: CRUD профилей правил
  - name: Detectors
    description: Реестр доступных детекторов
  - name: Logs
    description: Журнал событий
  - name: Stats
    description: Агрегированная статистика
  - name: Health
    description: Проверка состояния сервиса


# ============================================================
#  ПУТИ (ENDPOINTS)
# ============================================================

paths:

  # ----------------------------------------------------------
  #  SANITIZE
  # ----------------------------------------------------------

  /sanitize:
    post:
      tags: [Sanitize]
      summary: Санитайзировать текст
      description: |
        Основной эндпоинт. Вызывается Go Proxy при каждом запросе.
        
        Engine загружает профиль, определяет режим, запускает
        детекторы (если нужно), применяет действия и возвращает
        решение: send или block.
        
        При mode=passthrough детекторы НЕ запускаются,
        текст возвращается как есть мгновенно.
      operationId: sanitize
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanitizeRequest'
            examples:
              with_pii:
                summary: Текст с ПДн
                value:
                  texts:
                    - "Напиши письмо Иванову Петру, тел +7 916 123-45-67"
                  profile: "finance"
              clean_text:
                summary: Чистый текст
                value:
                  texts:
                    - "Какая погода в Москве?"
                  profile: "general"
              multiple_messages:
                summary: Несколько сообщений (system + user)
                value:
                  texts:
                    - "Ты помощник финансового отдела"
                    - "Подготовь отчёт для ООО Ромашка, ИНН 7707083893"
                  profile: "finance"
      responses:
        '200':
          description: Результат санитайзинга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanitizeResponse'
              examples:
                sanitized:
                  summary: Текст очищен (mode=sanitize)
                  value:
                    action: "send"
                    texts:
                      - "Напиши письмо [PERSON], тел +7 *** ***-**-67"
                    detections:
                      - type: "person_name"
                        value: "Иванову Петру"
                        start: 16
                        end: 29
                        action: "replace"
                        replacement: "[PERSON]"
                      - type: "phone_ru"
                        value: "+7 916 123-45-67"
                        start: 35
                        end: 51
                        action: "mask"
                        replacement: "+7 *** ***-**-67"
                    detection_count: 2
                    block_reason: null

                blocked:
                  summary: Запрос заблокирован (mode=block)
                  value:
                    action: "block"
                    texts: []
                    detections:
                      - type: "passport"
                        value: "45 20 123456"
                        start: 10
                        end: 22
                        action: "replace"
                        replacement: "[PASSPORT]"
                    detection_count: 1
                    block_reason: "Обнаружены чувствительные данные: паспорт (1)"

                passthrough:
                  summary: Пропущено без проверки (mode=passthrough)
                  value:
                    action: "send"
                    texts:
                      - "Данные клиента Иванова"
                    detections: []
                    detection_count: 0
                    block_reason: null

                clean:
                  summary: Ничего не найдено
                  value:
                    action: "send"
                    texts:
                      - "Какая погода в Москве?"
                    detections: []
                    detection_count: 0
                    block_reason: null

        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "profile_not_found"
                message: "Профиль 'unknown_profile' не найден"
                action: "block"

        '422':
          description: Невалидный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "validation_error"
                message: "Поле 'texts' не может быть пустым"

        '500':
          description: Внутренняя ошибка Engine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /analyze:
    post:
      tags: [Sanitize]
      summary: Анализ без замены
      description: |
        Только детекция, без применения действий.
        Используется Frontend демо-чатом, чтобы показать
        пользователю, что было найдено, с подсветкой позиций.
        
        Не записывает в лог (это не реальный запрос).
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            example:
              texts:
                - "Иванов Пётр, тел +7 916 123-45-67, ИНН 7707083893"
              profile: "general"
      responses:
        '200':
          description: Результат анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
              example:
                detections:
                  - type: "person_name"
                    value: "Иванов Пётр"
                    start: 0
                    end: 12
                    category: "personal"
                    confidence: 0.95
                  - type: "phone_ru"
                    value: "+7 916 123-45-67"
                    start: 18
                    end: 34
                    category: "personal"
                    confidence: 1.0
                  - type: "inn"
                    value: "7707083893"
                    start: 40
                    end: 50
                    category: "financial"
                    confidence: 1.0
                detection_count: 3
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  # ----------------------------------------------------------
  #  PROFILES
  # ----------------------------------------------------------

  /profiles:
    get:
      tags: [Profiles]
      summary: Список всех профилей
      description: |
        Возвращает краткую информацию о всех профилях.
        Используется Frontend для отображения списка
        и Go Proxy (опционально) для валидации.
      operationId: listProfiles
      responses:
        '200':
          description: Список профилей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfileSummary'
              example:
                - name: "general"
                  description: "Стандартный профиль"
                  mode: "sanitize"
                  detector_count: 7
                  is_default: true
                  created_at: "2024-03-01T10:00:00Z"
                  updated_at: "2024-03-10T15:30:00Z"
                - name: "finance"
                  description: "Строгий профиль для фин. отдела"
                  mode: "block"
                  detector_count: 12
                  is_default: false
                  created_at: "2024-03-05T09:00:00Z"
                  updated_at: "2024-03-05T09:00:00Z"
                - name: "local_llm"
                  description: "Для внутренней Ollama"
                  mode: "passthrough"
                  detector_count: 0
                  is_default: false
                  created_at: "2024-03-07T12:00:00Z"
                  updated_at: "2024-03-07T12:00:00Z"

    post:
      tags: [Profiles]
      summary: Создать новый профиль
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
            example:
              name: "hr_department"
              description: "Профиль для HR-отдела"
              mode: "sanitize"
              default_action: "replace"
              detectors:
                - type: "person_name"
                  action: "replace"
                  enabled: true
                - type: "phone_ru"
                  action: "mask"
                  enabled: true
                - type: "email"
                  action: "replace"
                  enabled: true
                - type: "passport"
                  action: "replace"
                  enabled: true
                - type: "snils"
                  action: "replace"
                  enabled: true
                - type: "inn_personal"
                  action: "replace"
                  enabled: false
              custom_rules: []
      responses:
        '201':
          description: Профиль создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '409':
          description: Профиль с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "conflict"
                message: "Профиль 'hr_department' уже существует"
        '422':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /profiles/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
        description: Имя профиля
        example: "finance"

    get:
      tags: [Profiles]
      summary: Получить профиль по имени
      description: |
        Возвращает полную информацию о профиле,
        включая все детекторы с их настройками.
        Используется Frontend для страницы редактирования.
      operationId: getProfile
      responses:
        '200':
          description: Полная информация о профиле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                name: "finance"
                description: "Строгий профиль для фин. отдела"
                mode: "block"
                default_action: "replace"
                detectors:
                  - type: "person_name"
                    action: "replace"
                    enabled: true
                    category: "personal"
                  - type: "phone_ru"
                    action: "mask"
                    enabled: true
                    category: "personal"
                  - type: "email"
                    action: "replace"
                    enabled: true
                    category: "personal"
                  - type: "card_number"
                    action: "mask"
                    enabled: true
                    category: "financial"
                  - type: "inn"
                    action: "replace"
                    enabled: true
                    category: "financial"
                  - type: "api_key"
                    action: "replace"
                    enabled: false
                    category: "credentials"
                  - type: "ip_address"
                    action: "replace"
                    enabled: false
                    category: "infrastructure"
                custom_rules:
                  - name: "contract_number"
                    pattern: "\\d{2}-[А-Я]{2}/\\d{4}"
                    action: "replace"
                    placeholder: "[CONTRACT]"
                    enabled: true
                is_default: false
                created_at: "2024-03-05T09:00:00Z"
                updated_at: "2024-03-12T14:20:00Z"
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Profiles]
      summary: Обновить профиль
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              description: "Обновлённый профиль для фин. отдела"
              mode: "sanitize"
              default_action: "replace"
              detectors:
                - type: "person_name"
                  action: "replace"
                  enabled: true
                - type: "phone_ru"
                  action: "mask"
                  enabled: true
              custom_rules: []
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Profiles]
      summary: Удалить профиль
      operationId: deleteProfile
      responses:
        '204':
          description: Профиль удалён
        '404':
          description: Профиль не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Нельзя удалить профиль по умолчанию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "conflict"
                message: "Нельзя удалить профиль по умолчанию 'general'"


  # ----------------------------------------------------------
  #  DETECTORS
  # ----------------------------------------------------------

  /detectors:
    get:
      tags: [Detectors]
      summary: Список всех доступных детекторов
      description: |
        Возвращает все зарегистрированные детекторы с метаданными.
        Используется Frontend при создании/редактировании профиля —
        чтобы отрисовать чекбоксы детекторов.
      operationId: listDetectors
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [personal, financial, credentials, infrastructure, corporate]
          description: Фильтр по категории
      responses:
        '200':
          description: Список детекторов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetectorInfo'
              example:
                - type: "person_name"
                  display_name: "ФИО"
                  description: "Имена, фамилии, отчества (все падежи)"
                  category: "personal"
                  engine: "natasha"
                  supported_actions: ["replace", "mask", "redact"]
                  examples: ["Иванов Пётр Сергеевич", "П.С. Иванов"]

                - type: "phone_ru"
                  display_name: "Телефон (РФ)"
                  description: "Российские мобильные и городские номера"
                  category: "personal"
                  engine: "regex"
                  supported_actions: ["replace", "mask", "redact"]
                  examples: ["+7 916 123-45-67", "8 (495) 123-45-67"]

                - type: "email"
                  display_name: "Email"
                  description: "Адреса электронной почты"
                  category: "personal"
                  engine: "regex"
                  supported_actions: ["replace", "mask", "redact"]
                  examples: ["ivanov@company.ru", "user@mail.com"]

                - type: "card_number"
                  display_name: "Номер банковской карты"
                  description: "Номера карт (валидация по алгоритму Луна)"
                  category: "financial"
                  engine: "regex"
                  supported_actions: ["replace", "mask", "redact"]
                  examples: ["4276 1234 5678 9012"]

                - type: "inn"
                  display_name: "ИНН"
                  description: "ИНН физлица (12 цифр) и юрлица (10 цифр)"
                  category: "financial"
                  engine: "regex"
                  supported_actions: ["replace", "redact"]
                  examples: ["7707083893", "772012345678"]

                - type: "ip_address"
                  display_name: "IP-адрес"
                  description: "IPv4-адреса внутренних сетей"
                  category: "infrastructure"
                  engine: "regex"
                  supported_actions: ["replace", "redact"]
                  examples: ["192.168.1.42", "10.0.0.1"]

                - type: "api_key"
                  display_name: "API-ключ"
                  description: "Ключи OpenAI, GitHub, AWS и др."
                  category: "credentials"
                  engine: "regex"
                  supported_actions: ["replace", "redact"]
                  examples: ["sk-proj-abc123...", "ghp_xxxxxx"]

                - type: "organization"
                  display_name: "Организация"
                  description: "Названия компаний и организаций"
                  category: "corporate"
                  engine: "natasha"
                  supported_actions: ["replace", "redact"]
                  examples: ["ООО Ромашка", "ПАО Сбербанк"]


  # ----------------------------------------------------------
  #  LOGS
  # ----------------------------------------------------------

  /logs:
    get:
      tags: [Logs]
      summary: Журнал событий
      description: |
        Возвращает список событий санитайзинга.
        Содержит только метаданные — тексты промптов НЕ хранятся.
      operationId: getLogs
      parameters:
        - name: profile
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по имени профиля
          example: "finance"

        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [send, block, warn]
          description: Фильтр по действию

        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Начало периода
          example: "2024-03-01"

        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Конец периода
          example: "2024-03-15"

        - name: has_detections
          in: query
          required: false
          schema:
            type: boolean
          description: |
            true — только события с находками
            false — только чистые
            не указан — все

        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Номер страницы

        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Количество записей на странице

      responses:
        '200':
          description: Список событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
              example:
                items:
                  - id: "evt-001"
                    timestamp: "2024-03-15T14:32:00Z"
                    profile: "finance"
                    mode: "sanitize"
                    action_taken: "send"
                    detection_count: 3
                    detection_types:
                      - type: "person_name"
                        count: 1
                      - type: "phone_ru"
                        count: 1
                      - type: "inn"
                        count: 1
                  - id: "evt-002"
                    timestamp: "2024-03-15T14:30:00Z"
                    profile: "finance"
                    mode: "block"
                    action_taken: "block"
                    detection_count: 2
                    detection_types:
                      - type: "passport"
                        count: 1
                      - type: "card_number"
                        count: 1
                  - id: "evt-003"
                    timestamp: "2024-03-15T14:28:00Z"
                    profile: "general"
                    mode: "sanitize"
                    action_taken: "send"
                    detection_count: 0
                    detection_types: []
                pagination:
                  page: 1
                  per_page: 50
                  total_items: 247
                  total_pages: 5


  # ----------------------------------------------------------
  #  STATS
  # ----------------------------------------------------------

  /stats/summary:
    get:
      tags: [Stats]
      summary: Сводная статистика
      description: |
        Агрегированные данные за период.
        Используется для дашборда.
      operationId: getStatsSummary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, week, month, all]
            default: week
          description: Период агрегации

        - name: profile
          in: query
          required: false
          schema:
            type: string
          description: Фильтр по профилю

      responses:
        '200':
          description: Сводная статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
              example:
                period: "week"
                total_requests: 247
                sanitized_count: 89
                blocked_count: 12
                warned_count: 3
                passthrough_count: 143
                total_detections: 234
                top_detections:
                  - type: "person_name"
                    display_name: "ФИО"
                    count: 156
                  - type: "phone_ru"
                    display_name: "Телефон"
                    count: 98
                  - type: "email"
                    display_name: "Email"
                    count: 67
                  - type: "api_key"
                    display_name: "API-ключ"
                    count: 34
                  - type: "ip_address"
                    display_name: "IP-адрес"
                    count: 23


  /stats/timeline:
    get:
      tags: [Stats]
      summary: Статистика по времени
      description: |
        Данные для построения графика запросов по дням/часам.
      operationId: getStatsTimeline
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [today, week, month]
            default: week

        - name: granularity
          in: query
          required: false
          schema:
            type: string
            enum: [hour, day]
            default: day
          description: |
            hour — для period=today
            day  — для period=week/month

      responses:
        '200':
          description: Временной ряд
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsTimeline'
              example:
                granularity: "day"
                points:
                  - date: "2024-03-11"
                    total: 32
                    sanitized: 12
                    blocked: 2
                    warned: 1
                    passthrough: 17
                  - date: "2024-03-12"
                    total: 45
                    sanitized: 18
                    blocked: 3
                    warned: 0
                    passthrough: 24
                  - date: "2024-03-13"
                    total: 38
                    sanitized: 15
                    blocked: 1
                    warned: 2
                    passthrough: 20


  # ----------------------------------------------------------
  #  HEALTH
  # ----------------------------------------------------------

  /health:
    get:
      tags: [Health]
      summary: Проверка состояния Engine
      description: |
        Используется Proxy для проверки доступности Engine
        и docker-compose healthcheck.
      operationId: healthCheck
      responses:
        '200':
          description: Engine работает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "ok"
                version: "1.0.0"
                profiles_loaded: 3
                detectors_loaded: 8
                uptime_seconds: 3600


# ============================================================
#  МОДЕЛИ ДАННЫХ (SCHEMAS)
# ============================================================

components:
  schemas:

    # --------------------------------------------------------
    #  SANITIZE
    # --------------------------------------------------------

    SanitizeRequest:
      type: object
      required: [texts, profile]
      properties:
        texts:
          type: array
          items:
            type: string
          description: |
            Массив текстов для проверки.
            Каждый элемент — содержимое одного сообщения (content).
            Proxy извлекает их из JSON по extract_fields
            и отправляет сюда.
          example:
            - "Ты помощник финансового отдела"
            - "Напиши письмо Иванову Петру, тел +7 916 123-45-67"
        profile:
          type: string
          description: Имя профиля для применения правил
          example: "finance"

    SanitizeResponse:
      type: object
      required: [action, texts, detections, detection_count]
      properties:
        action:
          type: string
          enum: [send, block]
          description: |
            Решение Engine:
            - send  — Proxy должен отправить texts в LLM
            - block — Proxy должен вернуть ошибку сотруднику
        texts:
          type: array
          items:
            type: string
          description: |
            Обработанные тексты.
            При action=send — очищенные (или оригинальные для passthrough/warn).
            При action=block — пустой массив.
        detections:
          type: array
          items:
            $ref: '#/components/schemas/Detection'
          description: Список найденных сущностей
        detection_count:
          type: integer
          description: Общее количество находок
        block_reason:
          type: string
          nullable: true
          description: |
            Человекочитаемая причина блокировки.
            Заполняется только при action=block.
          example: "Обнаружены чувствительные данные: ФИО (1), телефон (1)"

    Detection:
      type: object
      required: [type, value, start, end, action, replacement]
      properties:
        type:
          type: string
          description: Тип детектора
          example: "person_name"
        value:
          type: string
          description: Найденный фрагмент текста
          example: "Иванову Петру"
        start:
          type: integer
          description: Начальная позиция в тексте (индекс символа)
          example: 16
        end:
          type: integer
          description: Конечная позиция в тексте (не включительно)
          example: 29
        action:
          type: string
          enum: [replace, mask, redact, hash]
          description: Применённое действие
          example: "replace"
        replacement:
          type: string
          description: На что заменено
          example: "[PERSON]"
        category:
          type: string
          description: Категория сущности
          example: "personal"

    AnalyzeRequest:
      type: object
      required: [texts, profile]
      properties:
        texts:
          type: array
          items:
            type: string
        profile:
          type: string

    AnalyzeResponse:
      type: object
      required: [detections, detection_count]
      properties:
        detections:
          type: array
          items:
            $ref: '#/components/schemas/AnalyzeDetection'
        detection_count:
          type: integer

    AnalyzeDetection:
      type: object
      properties:
        type:
          type: string
          example: "person_name"
        value:
          type: string
          example: "Иванов Пётр"
        start:
          type: integer
          example: 0
        end:
          type: integer
          example: 12
        category:
          type: string
          example: "personal"
        confidence:
          type: number
          format: float
          description: |
            Уверенность детектора (0.0 — 1.0).
            Для regex всегда 1.0.
            Для natasha — зависит от модели.
          example: 0.95


    # --------------------------------------------------------
    #  PROFILES
    # --------------------------------------------------------

    ProfileSummary:
      type: object
      properties:
        name:
          type: string
          example: "finance"
        description:
          type: string
          example: "Строгий профиль для фин. отдела"
        mode:
          $ref: '#/components/schemas/Mode'
        detector_count:
          type: integer
          description: Количество включённых детекторов
          example: 12
        is_default:
          type: boolean
          description: Является ли профилем по умолчанию
          example: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Profile:
      type: object
      required: [name, mode, default_action, detectors]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,49}$'
          description: |
            Уникальное имя профиля.
            Латиница, цифры, подчёркивания. 3-50 символов.
          example: "finance"
        description:
          type: string
          maxLength: 200
          example: "Строгий профиль для фин. отдела"
        mode:
          $ref: '#/components/schemas/Mode'
        default_action:
          $ref: '#/components/schemas/Action'
        detectors:
          type: array
          items:
            $ref: '#/components/schemas/DetectorConfig'
        custom_rules:
          type: array
          items:
            $ref: '#/components/schemas/CustomRule'
          description: Кастомные regex-правила, заданные админом
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProfileCreate:
      type: object
      required: [name, mode, default_action, detectors]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,49}$'
        description:
          type: string
          maxLength: 200
        mode:
          $ref: '#/components/schemas/Mode'
        default_action:
          $ref: '#/components/schemas/Action'
        detectors:
          type: array
          items:
            $ref: '#/components/schemas/DetectorConfig'
        custom_rules:
          type: array
          items:
            $ref: '#/components/schemas/CustomRule'

    ProfileUpdate:
      type: object
      properties:
        description:
          type: string
          maxLength: 200
        mode:
          $ref: '#/components/schemas/Mode'
        default_action:
          $ref: '#/components/schemas/Action'
        detectors:
          type: array
          items:
            $ref: '#/components/schemas/DetectorConfig'
        custom_rules:
          type: array
          items:
            $ref: '#/components/schemas/CustomRule'

    DetectorConfig:
      type: object
      required: [type, enabled]
      properties:
        type:
          type: string
          description: Имя детектора из реестра
          example: "person_name"
        action:
          $ref: '#/components/schemas/Action'
        enabled:
          type: boolean
          description: Включён ли детектор в этом профиле
          example: true

    CustomRule:
      type: object
      required: [name, pattern, action, placeholder, enabled]
      properties:
        name:
          type: string
          description: Название правила
          example: "contract_number"
        pattern:
          type: string
          description: Regex-паттерн
          example: "\\d{2}-[А-Я]{2}/\\d{4}"
        action:
          $ref: '#/components/schemas/Action'
        placeholder:
          type: string
          description: На что заменять (при action=replace)
          example: "[CONTRACT]"
        enabled:
          type: boolean
          example: true

    Mode:
      type: string
      enum: [sanitize, block, warn, passthrough]
      description: |
        Режим работы профиля:
        - sanitize    — обнаружить и заменить, отправить очищенный текст
        - block       — обнаружить, если найдено — заблокировать запрос
        - warn        — обнаружить, залогировать, отправить как есть
        - passthrough — не проверять, отправить как есть мгновенно

    Action:
      type: string
      enum: [replace, mask, redact, hash]
      description: |
        Действие при обнаружении:
        - replace — заменить на плейсхолдер [TYPE]
        - mask    — частичная маскировка (***) 
        - redact  — полностью удалить из текста
        - hash    — заменить на хеш [TYPE:abc123]


    # --------------------------------------------------------
    #  DETECTORS
    # --------------------------------------------------------

    DetectorInfo:
      type: object
      properties:
        type:
          type: string
          description: Уникальный идентификатор детектора
          example: "person_name"
        display_name:
          type: string
          description: Человекочитаемое название (для UI)
          example: "ФИО"
        description:
          type: string
          example: "Имена, фамилии, отчества в любых падежах"
        category:
          type: string
          enum: [personal, financial, credentials, infrastructure, corporate]
          example: "personal"
        engine:
          type: string
          enum: [regex, natasha]
          description: Какой движок используется
          example: "natasha"
        supported_actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          description: Какие действия поддерживает этот детектор
          example: ["replace", "mask", "redact"]
        examples:
          type: array
          items:
            type: string
          description: Примеры того, что ловит (для UI)
          example: ["Иванов Пётр Сергеевич", "П.С. Иванов"]


    # --------------------------------------------------------
    #  LOGS
    # --------------------------------------------------------

    LogsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LogEntry:
      type: object
      properties:
        id:
          type: string
          example: "evt-001"
        timestamp:
          type: string
          format: date-time
          example: "2024-03-15T14:32:00Z"
        profile:
          type: string
          example: "finance"
        mode:
          $ref: '#/components/schemas/Mode'
        action_taken:
          type: string
          enum: [send, block, warn]
          description: Какое решение было принято
          example: "send"
        detection_count:
          type: integer
          example: 3
        detection_types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: "person_name"
              count:
                type: integer
                example: 1

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 50
        total_items:
          type: integer
          example: 247
        total_pages:
          type: integer
          example: 5


    # --------------------------------------------------------
    #  STATS
    # --------------------------------------------------------

    StatsSummary:
      type: object
      properties:
        period:
          type: string
          example: "week"
        total_requests:
          type: integer
          example: 247
        sanitized_count:
          type: integer
          example: 89
        blocked_count:
          type: integer
          example: 12
        warned_count:
          type: integer
          example: 3
        passthrough_count:
          type: integer
          example: 143
        total_detections:
          type: integer
          description: Суммарное количество найденных сущностей
          example: 234
        top_detections:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: "person_name"
              display_name:
                type: string
                example: "ФИО"
              count:
                type: integer
                example: 156

    StatsTimeline:
      type: object
      properties:
        granularity:
          type: string
          enum: [hour, day]
        points:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: "2024-03-11"
              total:
                type: integer
              sanitized:
                type: integer
              blocked:
                type: integer
              warned:
                type: integer
              passthrough:
                type: integer


    # --------------------------------------------------------
    #  HEALTH
    # --------------------------------------------------------

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: "ok"
        version:
          type: string
          example: "1.0.0"
        profiles_loaded:
          type: integer
          description: Количество профилей в кэше
          example: 3
        detectors_loaded:
          type: integer
          description: Количество зарегистрированных детекторов
          example: 8
        uptime_seconds:
          type: integer
          example: 3600


    # --------------------------------------------------------
    #  ERRORS
    # --------------------------------------------------------

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Машиночитаемый код ошибки
          example: "profile_not_found"
        message:
          type: string
          description: Человекочитаемое описание
          example: "Профиль 'unknown' не найден"
        action:
          type: string
          enum: [block]
          description: |
            Если ошибка произошла при /sanitize —
            подсказка для Proxy что делать.
            Всегда block (безопаснее заблокировать).