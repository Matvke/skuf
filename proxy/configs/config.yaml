port: 8080
engine_url: http://engine:8000
reload_debounce_ms: 500
targets:
    - name: openai-chat
      match:
        host: localhost:8080
        path: /
        methods:
            - POST
            - GET
      upstream:
        scheme: https
        host: httpbin.org
        path: /
      extract:
        json_paths:
            - data.chat.messages[*].parts[*].text
    - name: anthropic-messages
      match:
        host: api.anthropic.com
        path: /v1/messages
        methods:
            - POST
      upstream:
        scheme: https
        host: api.anthropic.com
        path: /v1/messages
      extract:
        json_paths:
            - messages[*].content
