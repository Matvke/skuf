port: 8080
engine_url: http://engine:8000
reload_debounce_ms: 500
targets:
    - name: openai-chat
      match:
        host: ""
        path: /v1/chat/completions
        methods:
            - POST
      upstream:
        scheme: https
        host: httpbin.org
        path: /anything
      extract:
        json_paths:
            - messages[*].content
    - name: anthropic-messages
      match:
        host: api.anthropic.com
        path: /v1/messages
        methods:
            - POST
      upstream:
        scheme: https
        host: api.anthropic.com
        path: /v1/messages
      extract:
        json_paths:
            - messages[*].content
